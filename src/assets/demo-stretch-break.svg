<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e1d4"/><stop offset="1" stop-color="#d6cbb9"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1a31"/><stop offset="1" stop-color="#0a1222"/></linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6ae"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a4a34" flood-opacity=".28"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- notebook -->
  <g filter="url(#sh)" transform="rotate(-8 250 420)">
    <rect x="80" y="210" width="330" height="430" rx="14" fill="#fbf8f2"/>
    <rect x="80" y="210" width="26" height="430" rx="8" fill="#c66b5a"/>
    <text x="140" y="275" font-family="Georgia, serif" font-size="30" fill="#3b3a36">Desk reset</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#55524b">
      <rect x="140" y="312" width="22" height="22" rx="5" fill="none" stroke="#5fae7d" stroke-width="3"/><path d="M145 323 l6 6 l10 -12" stroke="#5fae7d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <text x="176" y="330">Wall angels × 10</text>
      <rect x="140" y="358" width="22" height="22" rx="5" fill="none" stroke="#5fae7d" stroke-width="3"/><path d="M145 369 l6 6 l10 -12" stroke="#5fae7d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <text x="176" y="376">Chin tucks × 8</text>
      <rect x="140" y="404" width="22" height="22" rx="5" fill="none" stroke="#a59f93" stroke-width="3"/>
      <text x="176" y="422">Doorway stretch</text>
      <rect x="140" y="450" width="22" height="22" rx="5" fill="none" stroke="#a59f93" stroke-width="3"/>
      <text x="176" y="468">Refill water</text>
    </g>
    <path d="M140 540 q60 -16 120 0 t110 -4" stroke="#c66b5a" stroke-width="3" fill="none" opacity=".6"/>
  </g>
  <!-- phone with score -->
  <g filter="url(#sh)" transform="rotate(10 560 360)">
    <rect x="470" y="150" width="200" height="400" rx="34" fill="#1a1f2b"/>
    <rect x="480" y="160" width="180" height="380" rx="26" fill="url(#phone)"/>
    <rect x="545" y="172" width="50" height="12" rx="6" fill="#000"/>
    <text x="570" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8ea0bf">POSTURE NOW</text>
    <circle cx="570" cy="320" r="58" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="12"/>
    <circle cx="570" cy="320" r="58" fill="none" stroke="url(#ring2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="364" stroke-dashoffset="40" transform="rotate(-90 570 320)"/>
    <text x="570" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff">89</text>
    <rect x="510" y="410" width="120" height="12" rx="6" fill="#5fd6ae" opacity=".85"/>
    <rect x="525" y="432" width="90" height="9" rx="4.5" fill="#fff" opacity=".25"/>
    <rect x="505" y="476" width="130" height="38" rx="19" fill="#3b82f6"/>
  </g>
  <!-- coffee -->
  <g filter="url(#sh)">
    <circle cx="610" cy="650" r="82" fill="#f4efe6"/>
    <circle cx="610" cy="650" r="64" fill="#6b4029"/>
    <path d="M585 640 q25 -20 50 0 q-25 24 -50 0z" fill="#d9b48c" opacity=".8"/>
    <rect x="684" y="634" width="46" height="32" rx="16" fill="#f4efe6"/>
  </g>
  <!-- pen + resistance band -->
  <rect x="300" y="690" width="210" height="12" rx="6" fill="#2b2f3a" transform="rotate(-18 405 696)"/>
  <path d="M90 90 q120 -40 200 30 t180 10" stroke="#5fae7d" stroke-width="14" fill="none" stroke-linecap="round" opacity=".9"/>
</svg>
