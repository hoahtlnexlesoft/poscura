<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3550"/><stop offset="1" stop-color="#1b2338"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".55" stop-color="#f6a46b"/><stop offset="1" stop-color="#c46b5a"/></linearGradient>
    <radialGradient id="glow" cx=".22" cy=".3" r=".75"><stop offset="0" stop-color="#ffb877" stop-opacity=".45"/><stop offset="1" stop-color="#ffb877" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9925e"/><stop offset="1" stop-color="#9b6a40"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1a33"/><stop offset="1" stop-color="#132a4a"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6ae"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2c2a"/><stop offset="1" stop-color="#241b1b"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
