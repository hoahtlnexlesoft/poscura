  <rect x="300" y="540" width="760" height="26" rx="8" fill="url(#desk)"/>
  <rect x="340" y="566" width="18" height="190" rx="6" fill="#2b2f3a"/><rect x="1002" y="566" width="18" height="190" rx="6" fill="#2b2f3a"/>
  <rect x="330" y="740" width="60" height="12" rx="6" fill="#2b2f3a"/><rect x="980" y="740" width="60" height="12" rx="6" fill="#2b2f3a"/>
