  <rect x="730" y="522" width="34" height="14" rx="7" fill="#e7e9ee"/>
  <rect x="420" y="498" width="44" height="42" rx="8" fill="#e9dccb"/><path d="M464 508 q18 2 16 16 q-2 12 -16 10" fill="none" stroke="#e9dccb" stroke-width="6"/>
  <path d="M432 486 q6-12 0-22 M446 488 q6-12 0-22" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
