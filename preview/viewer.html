<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poscura — Mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" />
<style>
  :root { --bg:#0b0f17; --text:#eef2fa; --muted:#8b97ad; --item:#161d2b; --item-h:#1c2536; --accent:#1f8bff; --accent-soft:rgba(31,139,255,.14); --app:#0f1726; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Quicksand, system-ui, sans-serif; }
  body { display:grid; grid-template-columns: minmax(260px, 340px) 1fr minmax(220px, 300px); height:100vh; overflow:hidden; }

  /* ---------- left: screens ---------- */
  .left { overflow:auto; padding:40px 28px 40px 36px; }
  .left h1 { font-size:26px; font-weight:700; margin:0 0 14px; letter-spacing:-.01em; line-height:1.2; }
  .left p { color:var(--muted); font-size:14.5px; line-height:1.5; margin:0 0 18px; }
  .screens { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
  .screens button { width:100%; text-align:left; font:inherit; font-size:15px; font-weight:500; color:var(--text); background:transparent; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; line-height:1.3; }
  .screens button:hover { background:var(--item); }
  .screens button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .screens .num { font-variant-numeric: tabular-nums; display:inline-block; width:34px; color:var(--muted); }
  .screens button.on .num { color:var(--accent); }

  /* ---------- center: phone ---------- */
  .center { position:relative; overflow:visible; display:flex; align-items:center; justify-content:center; }
  .holder { position:relative; }
  .scaler { position:absolute; left:0; top:0; transform-origin:top left; }

  .device { position:relative; }
  .shell::before { content:""; position:absolute; inset:5px; border-radius:inherit; background:#050505; }
  .shell { position:absolute; inset:0; border-radius:inherit; }
  .screen { position:absolute; overflow:hidden; background:var(--app); display:flex; flex-direction:column; }
  .screen iframe { border:0; width:100%; flex:1; min-height:0; display:block; background:var(--app); }
  .statusbar { flex:none; display:flex; align-items:center; justify-content:space-between; color:#fff; font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif; font-weight:600; background:var(--app); }
  .sb-icons { display:flex; gap:6px; align-items:center; }
  .sb-icons svg { display:block; }
  .homebar { flex:none; background:var(--app); display:flex; justify-content:center; align-items:center; }
  .homebar i { display:block; border-radius:3px; background:#fff; opacity:.9; }
  .cut { position:absolute; background:#000; z-index:2; pointer-events:none; }
  .sidebtn { position:absolute; width:4px; border-radius:2px; }
  .se-home { position:absolute; left:50%; transform:translateX(-50%); width:64px; height:64px; border-radius:50%; background:#121317; box-shadow:inset 0 0 0 2px #2c2e35; }
  .se-speaker { position:absolute; left:50%; transform:translateX(-50%); width:60px; height:6px; border-radius:3px; background:#0a0a0a; }
  .se-cam { position:absolute; width:10px; height:10px; border-radius:50%; background:#0b0b10; box-shadow:inset 0 0 0 2px #1e2028; }

  /* ---------- right: devices ---------- */
  .right { overflow:auto; padding:40px 36px 40px 20px; display:flex; flex-direction:column; justify-content:center; }
  .right h2 { font-size:24px; font-weight:700; margin:0 0 18px; }
  .devices { display:flex; flex-direction:column; gap:6px; }
  .devices button { font:inherit; font-size:15px; font-weight:600; text-align:left; color:var(--text); background:var(--item); border:0; border-radius:10px; padding:10px 16px; cursor:pointer; }
  .devices button:hover { background:var(--item-h); }
  .devices button.on { background:var(--accent); color:#fff; }
  .meta { color:var(--muted); font-size:14px; margin-top:22px; line-height:1.5; }
  .orient { display:none; margin-top:14px; background:var(--item); border-radius:12px; padding:4px; gap:4px; }
  .orient.show { display:flex; }
  .orient button { flex:1; font:inherit; font-size:13.5px; font-weight:600; color:var(--muted); background:transparent; border:0; border-radius:9px; padding:8px 10px; cursor:pointer; }
  .orient button.on { background:#24304a; color:var(--text); }
  .tools { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .tools button { font:inherit; font-size:13px; font-weight:600; color:var(--muted); background:transparent; border:1px solid #263047; border-radius:10px; padding:7px 12px; cursor:pointer; }
  .tools button:hover { color:var(--text); border-color:var(--accent); }

  /* slim scrollbars to match the dark viewer */
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width:thin; scrollbar-color:rgba(238,242,250,.16) transparent; } }
  ::-webkit-scrollbar-button { display:none; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { border:2px solid transparent; border-radius:999px; background-clip:padding-box; background-color:rgba(238,242,250,.16); }
  ::-webkit-scrollbar-thumb:hover { background-color:rgba(238,242,250,.3); }
  ::-webkit-scrollbar-corner { background:transparent; }
  /* room for the comment rail on the right edge */
  .right { padding-right:118px; }
  /* ---------- small screens ---------- */
  @media (max-width: 980px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height:auto; min-height:100vh; overflow:auto; }
    .left { order:1; padding:20px 16px 8px; }
    .left p { margin-bottom:12px; font-size:14px; }
    .screens { flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px; }
    .screens li { flex:none; }
    .screens button { font-size:14px; padding:8px 12px; background:var(--item); white-space:nowrap; }
    .right { order:2; padding:8px 16px; justify-content:flex-start; }
    .right h2, .meta { display:none; }
    .devices { flex-direction:row; overflow-x:auto; }
    .devices button { font-size:14px; padding:8px 12px; white-space:nowrap; flex:none; }
    .tools { margin-top:8px; }
    .center { order:3; padding:16px 0 32px; min-height:70vh; }
    body { padding-right:44px; }
    .right { padding-right:16px; }
  }
</style>
</head>
<body>
<section class="left">
  <h1 id="title">Poscura · iPhone 16 Pro Max</h1>
  <p>Tap inside the phone like the real app. Swipe right to go back. Jump to any screen:</p>
  <ul class="screens" id="screens"></ul>
</section>

<section class="center" id="center">
  <div class="holder" id="holder"><div class="scaler" id="scaler"></div></div>
</section>

<section class="right">
  <h2>Device</h2>
  <div class="devices" id="devices"></div>
  <div class="meta" id="meta"></div>
  <div class="orient" id="orient"><button type="button" data-o="portrait">Portrait</button><button type="button" data-o="landscape">Landscape</button></div>
  <div class="tools">
    <button id="reload" type="button">Reload screen</button>
  </div>
</section>

<script>
(function () {
  var SCREENS = [
    { n:"01", label:"Sign in", path:"/login", auth:false },
    { n:"02", label:"Onboarding — profile", path:"/onboarding" },
    { n:"03", label:"Home", path:"/" },
    { n:"04", label:"Posture Monitor", path:"/posture-monitor" },
    { n:"05", label:"Workout", path:"/workout" },
    { n:"06", label:"Community", path:"/community" },
    { n:"07", label:"Notifications", path:"/notifications" },
    { n:"08", label:"Log Discomfort", path:"/discomfort" },
    { n:"09", label:"Body part — Head", path:"/body-part/head" },
    { n:"09b", label:"Body part — Shoulders", path:"/body-part/shoulders" },
    { n:"09c", label:"Body part — Spine & Torso", path:"/body-part/spine" },
    { n:"09d", label:"Body part — Pelvis", path:"/body-part/pelvis" },
    { n:"10", label:"My Account", path:"/account" },
    { n:"11", label:"Checkout — upgrade", path:"/checkout" },
    { n:"12", label:"Settings", path:"/settings" },
    { n:"13", label:"Support", path:"/support" }
  ];
  var DEVICES = [
    { id:"ip16pm", name:"iPhone 16 Pro Max", w:440, h:956, kind:"island", unit:"pt", color:"#8d8577" },
    { id:"ipse",   name:"iPhone SE",         w:375, h:667, kind:"home",   unit:"pt" },
    { id:"duo-c",  name:"iPhone Duo · Folded",   w:420, h:600, kind:"duo", unit:"pt", color:"#8d8577", layout:"rail" },
    { id:"duo-o",  name:"iPhone Duo · Open", w:744, h:968, kind:"fold",   unit:"pt", color:"#8d8577", crease:"v", rotate:true },
    { id:"zfold-c", name:"Galaxy Z Fold · Folded", w:412, h:600, kind:"punch", unit:"dp", color:"#3c3f45", tone:"#141619", radius:10, scr:10, layout:"rail", stack:true },
    { id:"zfold",  name:"Galaxy Z Fold · Open",         w:707, h:823, kind:"fold",   unit:"dp", color:"#3c3f45", tone:"#141619", android:true, silver:true, crease:"v", rotate:true }
  ];

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var state = store.get("pv.v2", { dev:"ip16pm", path:"/" });
  if (!DEVICES.some(function (d) { return d.id === state.dev; })) state.dev = "ip16pm";
  function save() { store.set("pv.v2", state); }
  // device as currently shown (landscape swaps width/height and turns the fold line)
  function view() {
    var d = dev();
    if (!d.rotate) return d;
    return Object.assign({}, d, { w:d.h, h:d.w, crease:"v", land:true });
  }
  function dev() { return DEVICES.filter(function (d) { return d.id === state.dev; })[0]; }

  // ---------- status bar icons ----------
  var W = "#fff";
  var I = {
    sig: '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="'+W+'"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="'+W+'"/><rect x="10" y="3" width="3" height="9" rx="1" fill="'+W+'"/><rect x="15" y="0" width="3" height="12" rx="1" fill="'+W+'"/></svg>',
    wifi: '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0z" fill="'+W+'"/><path d="M8 5.2c1.7 0 3.3.6 4.5 1.7l1.4-1.7A9 9 0 0 0 8 3a9 9 0 0 0-5.9 2.2l1.4 1.7A6.7 6.7 0 0 1 8 5.2z" fill="'+W+'"/><path d="M8 0C5 0 2.3 1.1.2 2.9l1.4 1.7A10.9 10.9 0 0 1 8 2.2c2.4 0 4.6.9 6.4 2.4l1.4-1.7A13.1 13.1 0 0 0 8 0z" fill="'+W+'"/></svg>',
    batt: '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="'+W+'" stroke-opacity=".45"/><rect x="2" y="2" width="20" height="9" rx="2" fill="'+W+'"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="'+W+'" fill-opacity=".45"/></svg>',
    aBatt: '<svg width="10" height="15" viewBox="0 0 10 15"><rect x="3" y="0" width="4" height="2" fill="'+W+'"/><rect x="0" y="1.5" width="10" height="13.5" rx="1.5" fill="'+W+'"/></svg>',
    aSig: '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M14 0v14H0z" fill="'+W+'"/></svg>',
    aWifi: '<svg width="16" height="13" viewBox="0 0 16 13"><path d="M8 13L0 3.4A12 12 0 0 1 16 3.4z" fill="'+W+'"/></svg>'
  };
  function clock() { return "9:41"; }

  // ---------- phone ----------
  var scaler = document.getElementById("scaler"), holder = document.getElementById("holder");
  var frame, size = { w:0, h:0 };

  function buildPhone() {
    var d = view(), k = d.kind, html = "", ow, oh, sl, st, radius, scr, top, bot, sb = "", hb = "", cut = "", extra = "", bg;
    if (k === "island") {
      ow = d.w + 36; oh = d.h + 36; sl = st = 18; radius = 74; scr = 58; top = 59; bot = 34;
      bg = "linear-gradient(145deg," + d.color + ",#514b42 40%,#3b3731)";
      sb = '<div class="statusbar" style="height:59px;padding:0 34px 0 50px;font-size:17px"><span class="clock">' + clock() + '</span><span class="sb-icons">' + I.sig + I.wifi + I.batt + "</span></div>";
      hb = '<div class="homebar" style="height:34px"><i style="width:140px;height:5px"></i></div>';
      cut = '<div class="cut" style="left:50%;top:11px;transform:translateX(-50%);width:126px;height:37px;border-radius:20px"></div>';
      var c = "#5a544b";
      extra = '<span class="sidebtn" style="background:'+c+';left:-3px;top:180px;height:34px"></span><span class="sidebtn" style="background:'+c+';left:-3px;top:240px;height:64px"></span><span class="sidebtn" style="background:'+c+';left:-3px;top:316px;height:64px"></span><span class="sidebtn" style="background:'+c+';right:-3px;top:260px;height:100px"></span><div class="shell"></div>';
    } else if (k === "home") {
      ow = d.w + 36; oh = d.h + 178; sl = 18; st = 89; radius = 60; scr = 2; top = 20; bot = 0;
      bg = "linear-gradient(145deg,#2a2c31,#141518)";
      sb = '<div class="statusbar" style="height:20px;padding:0 8px;font-size:12px"><span class="sb-icons">' + I.sig + I.wifi + '</span><span class="clock">' + clock() + '</span><span class="sb-icons"><span>100%</span>' + I.batt + "</span></div>";
      var c2 = "#2e3036";
      extra = '<span class="sidebtn" style="background:'+c2+';left:-3px;top:110px;height:30px"></span><span class="sidebtn" style="background:'+c2+';left:-3px;top:170px;height:56px"></span><span class="sidebtn" style="background:'+c2+';left:-3px;top:236px;height:56px"></span><span class="sidebtn" style="background:'+c2+';right:-3px;top:170px;height:66px"></span>' +
        '<span class="se-cam" style="top:40px;left:calc(50% - 62px)"></span><span class="se-speaker" style="top:42px"></span><span class="se-home" style="bottom:14px"></span>';
    } else if (k === "duo") {
      // folded book-style iPhone: cover screen, hinge on the left, camera in the top-right corner
      ow = d.w + 28; oh = d.h + 28; sl = st = 14; radius = "18px 58px 58px 18px"; scr = "6px 44px 44px 6px"; top = 38; bot = 20;
      bg = "linear-gradient(145deg," + d.color + ",#514b42 40%,#3b3731)";
      // real Duo cover screen: no status row — punch-hole camera top-right with the clock and Wi-Fi stacked under it,
      // centred on the same column as the right-hand menu (rail centre sits 48px from the screen's right edge)
      top = 0;
      sb = "";
      hb = '<div class="homebar" style="height:20px"><i style="width:120px;height:5px"></i></div>';
      cut = '<div class="cut" style="right:40px;top:12px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#26324a 0 1.5px,#06070a 2.5px)"></div>' +
        '<div style="position:absolute;right:48px;top:38px;transform:translateX(50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 1px 2px rgba(0,0,0,.35)">' +
        '<span style="color:#fff;font:600 13px/1 -apple-system,\'SF Pro Text\',system-ui,sans-serif;letter-spacing:-.2px;font-variant-numeric:tabular-nums">' + clock() + '</span>' +
        '<span style="display:block;line-height:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))">' + I.wifi + '</span></div>';
      var c5 = "#5a544b";
      extra = '<span class="sidebtn" style="background:'+c5+';right:-3px;top:110px;height:64px"></span><span class="sidebtn" style="background:'+c5+';top:-3px;right:150px;width:56px;height:4px"></span><div class="shell"></div>' +
        '<span style="position:absolute;left:-4px;top:12px;bottom:12px;width:7px;border-radius:4px;background:linear-gradient(90deg,#1c1d20,#6a6357 55%,#2c2925)"></span>';
    } else if (k === "fold") {
      ow = d.w + (d.android ? 20 : 28); oh = d.h + (d.android ? 20 : 28); sl = st = d.android ? 10 : 14; radius = d.android ? 10 : 44; scr = d.android ? 10 : 30;
      bg = d.silver ? "linear-gradient(145deg," + d.color + "," + d.tone + ")" : "linear-gradient(145deg," + d.color + "," + (d.tone || "#514b42") + " 40%,#1f2226)";
      if (d.android) {
        top = 36; bot = 22;
        sb = '<div class="statusbar" style="height:36px;padding:0 24px;font-family:Roboto,system-ui,sans-serif;font-weight:500;font-size:14px"><span class="clock">' + clock() + '</span><span class="sb-icons">' + I.aWifi + I.aSig + I.aBatt + "</span></div>";
        hb = '<div class="homebar" style="height:22px"><i style="width:120px;height:4px"></i></div>';
      } else {
        top = 44; bot = 20;
        sb = '<div class="statusbar" style="height:44px;padding:0 36px;font-size:16px"><span class="clock">' + clock() + '</span><span class="sb-icons">' + I.sig + I.wifi + I.batt + "</span></div>";
        hb = '<div class="homebar" style="height:20px"><i style="width:180px;height:5px"></i></div>';
      }
      var c4 = d.silver ? "#2c2f35" : d.android ? "#3b3f46" : "#5a544b";
      var hg = d.silver ? "linear-gradient(90deg,#16181b,#5a5f68,#16181b)" : "linear-gradient(90deg,#1c1d20," + (d.android ? "#565b63" : "#6a6357") + ",#1c1d20)";
      if (!d.land) {
        cut = '<div class="cut" style="left:75%;top:13px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%"></div>';
        extra = '<span class="sidebtn" style="background:'+c4+';right:-3px;top:120px;height:60px"></span><span class="sidebtn" style="background:'+c4+';top:-3px;left:80px;width:70px;height:4px"></span><div class="shell"></div>' +
          '<span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:' + (d.silver ? 4 : 6) + 'px;transform:translateX(-50%);background:' + hg + ';border-radius:3px"></span>';
      } else {
        // landscape book fold: hinge stays vertical in the middle; Galaxy shows a punch-hole on the right panel,
        // iPhone Duo hides its inner camera under the display (Apple newsroom, Sep 2026)
        cut = d.android ? '<div class="cut" style="left:75%;top:13px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%"></div>' : "";
        if (!d.android) {
          // iPhone Duo open: same corner status as the cover screen — clock and Wi-Fi stacked over the right-hand menu column
          top = 0; sb = "";
          cut = '<div style="position:absolute;right:48px;top:16px;transform:translateX(50%);z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;text-shadow:0 1px 2px rgba(0,0,0,.35)">' +
            '<span style="color:#fff;font:600 13px/1 -apple-system,\'SF Pro Text\',system-ui,sans-serif;letter-spacing:-.2px;font-variant-numeric:tabular-nums">' + clock() + '</span>' +
            '<span style="display:block;line-height:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))">' + I.wifi + '</span></div>';
        }
        extra = '<span class="sidebtn" style="background:'+c4+';right:-3px;top:110px;height:60px"></span><span class="sidebtn" style="background:'+c4+';top:-3px;right:120px;width:70px;height:4px"></span><div class="shell"></div>' +
          '<span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:' + (d.silver ? 4 : 6) + 'px;transform:translateX(-50%);background:' + hg + ';border-radius:3px"></span>';
      }
    } else {
      ow = d.w + 28; oh = d.h + 30; sl = 14; st = 15; radius = d.radius || 52; scr = d.scr || 40; top = 40; bot = 24;
      bg = "linear-gradient(145deg," + d.color + "," + (d.tone || "#24272c") + ")";
      sb = '<div class="statusbar" style="height:40px;padding:0 24px;font-family:Roboto,system-ui,sans-serif;font-weight:500;font-size:14px"><span class="clock">' + clock() + '</span><span class="sb-icons">' + I.aWifi + I.aSig + I.aBatt + "</span></div>";
      hb = '<div class="homebar" style="height:24px"><i style="width:108px;height:4px"></i></div>';
      var c3 = "#3b3f46";
      if (d.landscape) {
        // lying on its side: camera on the left edge, buttons along the top
        ow = d.w + 30; oh = d.h + 28; sl = 15; st = 14;
        cut = '<div class="cut" style="left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%"></div>';
        extra = '<span class="sidebtn" style="background:'+c3+';top:-3px;right:190px;width:60px;height:4px"></span><span class="sidebtn" style="background:'+c3+';top:-3px;right:270px;width:110px;height:4px"></span><div class="shell"></div>';
      } else {
        cut = '<div class="cut" style="left:50%;top:12px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%"></div>';
        extra = '<span class="sidebtn" style="background:'+c3+';right:-3px;top:190px;height:60px"></span><span class="sidebtn" style="background:'+c3+';right:-3px;top:270px;height:110px"></span><div class="shell"></div>';
      }
      // folded book-style phone: hinge spine along the left edge
      if (d.hingeL) extra += '<span style="position:absolute;left:-4px;top:18px;bottom:18px;width:7px;border-radius:4px;background:linear-gradient(90deg,#16181c,#565b63 55%,#2a2d33)"></span>';
    }
    html = '<div class="device" style="width:' + ow + "px;height:" + oh + "px;border-radius:" + (typeof radius === "number" ? radius + "px" : radius) + ";background:" + bg + ';box-shadow:' + (d.stack || d.silver ? '0 0 0 1px #50545c,inset 0 1px 0 rgba(255,255,255,.14)' + (d.silver ? ',0 40px 80px rgba(0,0,0,.6)' : '') : '0 0 0 2px #3a3d45,0 40px 80px rgba(0,0,0,.6)') + '">' + extra +
      '<div class="screen" style="left:' + sl + "px;top:" + st + "px;width:" + d.w + "px;height:" + d.h + "px;border-radius:" + (typeof scr === "number" ? scr + "px" : scr) + '">' +
      sb + '<iframe title="Poscura" id="app"></iframe>' + hb + cut + crease(d) + "</div></div>" + hingeEdges(d, ow, oh);
    // folded phone: the back half peeks out below and to the right, with a seam and a hinge spine on the left
    var back = "";
    if (d.stack) {
      // folded: the back half sits right behind the front one; its edge shows as a second metal band on the right and bottom, split by a seam
      var R = (typeof radius === "number" ? radius + "px" : radius);
      back = '<div aria-hidden="true" style="position:absolute;left:0;top:1px;width:' + (ow + 7) + 'px;height:' + (oh + 2) + 'px;border-radius:' + R + ';background:linear-gradient(90deg,#1c1e22 0%,#3e424a 70%,#6a6f78 88%,#2a2d33 100%);box-shadow:0 40px 80px rgba(0,0,0,.6),inset -1px -1px 0 rgba(0,0,0,.25)"></div>' +
        '<div aria-hidden="true" style="position:absolute;left:0;top:0;width:' + (ow + 1) + 'px;height:' + (oh + 1) + 'px;border-radius:' + R + ';box-shadow:1.5px 1.5px 0 rgba(0,0,0,.75)"></div>';
    }
    scaler.innerHTML = '<div style="position:relative">' + back + html + "</div>";
    size = { w:ow, h:oh };
    frame = document.getElementById("app");
    layout();
  }

  // faint fold line over the screen (does not block taps)
  function crease(d) {
    if (d.crease === "h") return '<div style="position:absolute;left:0;right:0;top:50%;height:14px;transform:translateY(-50%);pointer-events:none;z-index:3;background:linear-gradient(180deg,transparent,rgba(255,255,255,.035) 45%,rgba(0,0,0,.18) 50%,rgba(255,255,255,.035) 55%,transparent)"></div>';
    if (d.crease === "v" && d.android) return '<div style="position:absolute;top:0;bottom:0;left:50%;width:10px;transform:translateX(-50%);pointer-events:none;z-index:3;background:linear-gradient(90deg,transparent,rgba(255,255,255,.02) 45%,rgba(0,0,0,.09) 50%,rgba(255,255,255,.02) 55%,transparent)"></div>';
    if (d.crease === "v") return '<div style="position:absolute;top:0;bottom:0;left:50%;width:16px;transform:translateX(-50%);pointer-events:none;z-index:3;background:linear-gradient(90deg,transparent,rgba(255,255,255,.035) 45%,rgba(0,0,0,.2) 50%,rgba(255,255,255,.035) 55%,transparent)"></div>';
    return "";
  }
  // hinge marks on the frame sides for a flip phone
  function hingeEdges(d, ow, oh) {
    if (d.crease !== "h" || d.land) return "";
    var y = oh / 2 - 9;
    return '<span style="position:absolute;left:-4px;top:' + y + 'px;width:6px;height:18px;border-radius:3px;background:#2a3142"></span>' +
           '<span style="position:absolute;right:-4px;top:' + y + 'px;width:6px;height:18px;border-radius:3px;background:#2a3142"></span>';
  }

  function layout() {
    var c = document.getElementById("center");
    var narrow = window.innerWidth <= 980;
    var availW = c.clientWidth - 24, availH = narrow ? window.innerHeight * 0.85 : c.clientHeight - 32;
    var s = Math.min(1, availW / size.w, availH / size.h);
    s = Math.max(0.3, s);
    scaler.style.transform = "scale(" + s + ")";
    holder.style.width = size.w * s + "px";
    holder.style.height = size.h * s + "px";
  }

  // ---------- navigation ----------
  function needsAuth(path) {
    var sc = SCREENS.filter(function (s) { return s.path === path; })[0];
    return !(sc && sc.auth === false);
  }
  var ready = false;
  // navigate: talk to the app by message (works even when the frame is sandboxed);
  // a fresh load gets its start-up options through the frame's name
  function go(path, reload) {
    state.path = path; save(); markActive(path);
    var auth = needsAuth(path);
    if (!reload && ready && frame && frame.contentWindow) {
      frame.contentWindow.postMessage({ poscura: true, type: "go", path: path, auth: auth }, "*");
      return;
    }
    ready = false;
    // a new frame, named before it loads, so the app reads its options on start-up
    var nf = document.createElement("iframe");
    nf.title = "Poscura"; nf.id = "app";
    nf.name = JSON.stringify({ layout: view().layout || "", auth: auth });
    nf.src = "app.html#" + path;
    frame.replaceWith(nf);
    frame = nf;
  }
  window.poscuraGo = function (path) { go(path); };
  // which simulated device the reviewer is looking at (read by the comment kit)
  window.poscuraDevice = function () { var d = view(); return { name: d.name, size: d.w + "×" + d.h + " " + d.unit }; };
  function markActive(path) {
    document.querySelectorAll("#screens button").forEach(function (b) { b.classList.toggle("on", b.dataset.path === path); });
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.poscura !== true || !frame || e.source !== frame.contentWindow) return;
    if (m.type === "ready") ready = true;
    if (m.type === "route" && m.path) { state.path = m.path; save(); markActive(m.path); }
  });

  // ---------- lists ----------
  document.getElementById("screens").innerHTML = SCREENS.map(function (s) {
    return '<li><button type="button" data-path="' + s.path + '"><span class="num">' + s.n + "</span> " + s.label + "</button></li>";
  }).join("");
  document.getElementById("screens").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) go(b.dataset.path);
  });

  function renderDevices() {
    document.getElementById("devices").innerHTML = DEVICES.map(function (d) {
      return '<button type="button" data-id="' + d.id + '" class="' + (d.id === state.dev ? "on" : "") + '">' + d.name + "</button>";
    }).join("");
    var d = view();
    var o = document.getElementById("orient");
    o.classList.toggle("show", false);
    o.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.o === (state.orient || "portrait")); });
    document.getElementById("title").textContent = "Poscura · " + d.name;
    document.getElementById("meta").textContent = "Poscura app prototype · " + d.w + " × " + d.h + " " + d.unit;
  }
  document.getElementById("devices").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.dataset.id === state.dev) return;
    state.dev = b.dataset.id; save(); renderDevices(); buildPhone(); go(state.path, true);
  });
  document.getElementById("orient").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.dataset.o === (state.orient || "portrait")) return;
    state.orient = b.dataset.o; save(); renderDevices(); buildPhone(); go(state.path, true);
  });
  document.getElementById("reload").addEventListener("click", function () { go(state.path, true); });
  window.addEventListener("resize", layout);

  renderDevices();
  buildPhone();
  go(state.path || "/", true);
})();
</script>
<script src="review/config.js?v=1"></script><script src="review/review.js?v=10" defer></script>
